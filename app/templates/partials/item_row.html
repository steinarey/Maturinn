<li class="row item">
  <span class="handle" aria-hidden="true">⠿</span>
  <input type="hidden" name="item_id" value="{{ row.id }}">
  <input type="text" name="item_name" value="{{ row.name }}" placeholder="{{ t('edit.item_placeholder') }}" aria-label="{{ t('recipe.items') }}">
  <button class="btn icon remove" type="button" aria-label="{{ t('action.remove') }}" title="{{ t('action.remove') }}">✕</button>
</li>
