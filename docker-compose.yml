# Local development. In production (Unraid) only the app container runs,
# pointed at the existing Postgres server via DATABASE_URL.
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: maturinn
      POSTGRES_PASSWORD: maturinn
      POSTGRES_DB: maturinn
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maturinn"]
      interval: 2s
      retries: 20

  app:
    build: .
    environment:
      DATABASE_URL: postgresql://maturinn:maturinn@db:5432/maturinn
      DB_SCHEMA: maturinn
      DEFAULT_LANG: is
    ports:
      - "8000:8000"
    volumes:
      - ./data/photos:/data/photos
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
