[project]
name = "maturinn"
version = "0.1.0"
description = "Self-hosted bilingual recipe app"
authors = [
    { name = "Steinar Valsson", email = "steinarey@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "babel>=2.18.0",
    "fastapi>=0.162.2",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "langchain-anthropic>=1.7.10",
    "langchain-core>=1.7.6",
    "langchain-google-genai>=4.4.3",
    "langchain-openai>=1.7.4",
    "msal>=1.39.0",
    "pillow>=13.0.0",
    "psycopg[binary]>=3.3.8",
    "pydantic-settings>=2.16.2",
    "python-multipart>=0.0.33",
    "recipe-scrapers>=15.13.0",
    "sqlalchemy>=2.0",
    "trafilatura>=2.3.1",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore:Using `httpx` with `starlette.testclient`:DeprecationWarning"]
